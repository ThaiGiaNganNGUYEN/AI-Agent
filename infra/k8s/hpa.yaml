apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentflow
  namespace: agentflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentflow
  # Keep one replica while the database is the pod-local sqlite file.
  # Raise maxReplicas after AGENTFLOW_DATABASE_URL points at shared Postgres.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
