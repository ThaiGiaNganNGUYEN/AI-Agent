[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "AgentFlow Enterprise — a multi-agent workflow platform for treasury operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.36",
  "python-multipart>=0.0.12",
  "prometheus-client>=0.21.0",
  "pyyaml>=6.0.2",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
]
chroma = [
  "chromadb>=0.5.0",
]

[project.scripts]
agentflow = "agentflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentflow = ["resources/*.yaml", "resources/knowledge/*.md", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["agentflow"]
branch = true
omit = ["agentflow/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
